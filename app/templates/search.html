{% extends "base.html" %}

{% block content %}
<style>
    .search-card {
        padding: 20px 12px;
        animation: settle 0.7s ease 0.05s both;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    /* ---- radar / pulse animation ---- */
    .radar {
        position: relative;
        width: 168px;
        height: 168px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .radar-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--rose);
        opacity: 0;
        animation: radar-pulse 2.6s ease-out infinite;
    }

    .radar-ring:nth-child(2) {
        border-color: var(--gold-bright);
        animation-delay: 0.85s;
    }

    .radar-ring:nth-child(3) {
        border-color: var(--rose-dim);
        animation-delay: 1.7s;
    }

    @keyframes radar-pulse {
        0% {
            transform: scale(0.55);
            opacity: 0.65;
        }
        75% {
            opacity: 0;
        }
        100% {
            transform: scale(1.85);
            opacity: 0;
        }
    }

    .search-icon-wrap {
        position: relative;
        z-index: 1;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(255, 107, 127, 0.18), rgba(245, 217, 154, 0.14));
        border: 1px solid var(--glass-border);
        box-shadow: 0 12px 34px rgba(255, 107, 127, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        animation: icon-breathe 2.6s ease-in-out infinite;
    }

    @keyframes icon-breathe {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.07);
        }
    }

    .search-icon {
        width: 36px;
        height: 36px;
    }

    .search-icon .glass-part {
        stroke: var(--gold-bright);
    }

    .search-icon .heart-part {
        fill: var(--rose);
        stroke: none;
    }

    /* small floating sparks around the radar for extra liveliness */
    .spark {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold-bright);
        opacity: 0;
        animation: spark-float 3.2s ease-in-out infinite;
    }

    .spark:nth-child(4) {
        top: 6%;
        left: 12%;
        animation-delay: 0s;
        background: var(--rose);
    }

    .spark:nth-child(5) {
        top: 14%;
        right: 8%;
        animation-delay: 1.1s;
    }

    .spark:nth-child(6) {
        bottom: 10%;
        left: 6%;
        animation-delay: 2.1s;
        background: var(--rose-dim);
    }

    @keyframes spark-float {
        0% {
            transform: translateY(6px) scale(0.6);
            opacity: 0;
        }
        35% {
            opacity: 1;
        }
        100% {
            transform: translateY(-14px) scale(1);
            opacity: 0;
        }
    }

    .search-title {
        margin: 26px 0 8px;
        font-weight: 500;
        font-size: clamp(21px, 5vw, 27px);
    }

    .search-sub {
        margin: 0 0 32px;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
        max-width: 36ch;
    }

    /* ---- progress bar ---- */
    .progress-wrap {
        width: 200px;
    }

    .progress-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--glass-border);
        overflow: hidden;
    }

    .progress-fill {
        position: relative;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--rose), var(--gold-bright));
        animation-name: fill-progress;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
        overflow: hidden;
    }

    @keyframes fill-progress {
        from {
            width: 0%;
        }
        to {
            width: 100%;
        }
    }

    .progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.45) 45%, transparent 65%);
        background-size: 220% 100%;
        animation: shimmer 1.5s linear infinite;
    }

    @keyframes shimmer {
        from {
            background-position: 220% 0;
        }
        to {
            background-position: -60% 0;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .radar-ring, .search-icon-wrap, .spark, .progress-fill::after {
            animation: none !important;
        }
    }

    /* ---- Responsive ---- */
    @media (max-width: 520px) {
        body {
            padding: 24px 12px;
        }

        .search-card {
            padding: 16px 10px;
        }

        .radar {
            width: 136px;
            height: 136px;
        }

        .search-icon-wrap {
            width: 70px;
            height: 70px;
        }

        .search-icon {
            width: 30px;
            height: 30px;
        }

        .search-title {
            margin-top: 22px;
        }
    }
</style>
</head>
<body>

<div class="bg-layer">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
</div>

<div class="page">
    <div class="search-card">

        <div class="radar">
            <span class="radar-ring"></span>
            <span class="radar-ring"></span>
            <span class="radar-ring"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <div class="search-icon-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle class="glass-part" cx="10.5" cy="10.5" r="6.5" stroke-width="1.8"/>
                    <path class="glass-part" d="M19.5 19.5 L15.3 15.3" stroke-width="1.8" stroke-linecap="round"/>
                    <path class="heart-part"
                          d="M10.5 13.4c-2.6-1.66-3.9-2.98-3.9-4.53 0-1.06.85-1.87 1.9-1.87.6 0 1.18.29 1.53.75l.47.6.47-.6c.35-.46.93-.75 1.53-.75 1.05 0 1.9.81 1.9 1.87 0 1.55-1.3 2.87-3.9 4.53Z"/>
                </svg>
            </div>
        </div>

        <h1 class="search-title">Идёт поиск новых контактов</h1>
        <p class="search-sub">Подбираем анкеты по вашим настройкам - это займёт всего несколько секунд.</p>

        <div class="progress-wrap">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

    </div>
</div>

<script>
    const DURATION_SECONDS = 3;

    const progressFillEl = document.getElementById('progressFill');

    // Применяем длительность к CSS-анимации прогресс-бара.
    progressFillEl.style.animationDuration = DURATION_SECONDS + 's';

    // Перезагрузка страницы по истечении заданного времени.
    setTimeout(() => {
        window.location.reload();
    }, DURATION_SECONDS * 1000);
</script>
{% endblock %}
